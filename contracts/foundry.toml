[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# The onchain SVG builder in IkrarAkadNFT concatenates enough string fragments to exhaust the
# legacy pipeline's stack. via_ir also lets the vault keep descriptive local variables.
via_ir = true
# The deploy script writes the frontend address book so `web/` never hardcodes a deployment.
fs_permissions = [{ access = "read-write", path = "../web/src/generated" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
